<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset= "UTF-8">
    <title>GolieXeeGardens Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Chat Teaser-->
    <div id="chat-launcher">
        <div id="chat-teaser">
            Hello! I'm AskLee AI. Feel free to ask me any question you may have?
        </div>
        <!--Chat Button-->
        <div id="chat-button">
            <img src="images/chat_icon.png" alt="GolieXeeGardens Logo"> 
        </div>
    </div>
    <!--Chat Window-->
    <div id="chat-widget" class="hidden">
        <div id="chat-header">
            <span>AskLee AI</span>
            <span id="close-chat">X</span>
        </div>

        <div id="chat-messages">
            <div id="faq-section">
                <p class="faq-title">Hello I'm here to help!</p>
                <p class="faq-subtitle">Here are some Popular Questions that are frequently asked... </p>
            </div>

            <div class="faq-chips">
                <button class="faq-btn" data-question="What are your hours?">
                    What are your hours?
                </button>
                <button class="faq-btn" data-question="What vegetables do you sell?">
                    What vegetables do you sell?
                </button>
                <button class="faq-btn" data-question="Where are you located?">
                    Where are you located?
                </button>
                <button class="faq-btn" data-question="How can I contact you?">
                    How can I contact you?
                </button>
            </div>

        </div>

        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="What questions do you have?" />
            <button id="send-btn"> Send </button>
        </div>

        <span id="chat-footer">
            AskLee AI can make mistakes. Still in training and improving.
        </span>
    </div>
    <script src="functionality.js" defer></script>
    <script src="sess_storage.js" defer></script>
</body>
</html>
